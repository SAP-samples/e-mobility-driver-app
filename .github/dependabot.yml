version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/app/driver-vue"
    schedule:
      interval: "weekly"
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: "npm"
    directory: "/approuter"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/cli"
    schedule:
      interval: "weekly"
